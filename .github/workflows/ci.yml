name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv venv --python 3.12
      - run: uv pip install -r requirements-pipeline.txt
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
