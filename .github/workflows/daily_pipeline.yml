name: daily-pipeline

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require local bootstrap data
        run: |
          missing=0
          for path in \
            data/processed/pipeline_state.json \
            data/processed/prices.parquet \
            data/processed/news.parquet \
            data/processed/daily_sentiment.parquet \
            data/processed/returns.parquet; do
            if [ ! -f "$path" ]; then
              echo "Missing bootstrap file: $path" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Run the first bootstrap locally (uv run python -m finsent daily)," \
                 "commit data/processed, and push before using this workflow." >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('requirements-pipeline.txt') }}
      - run: uv pip install -r requirements-pipeline.txt
      - name: Require news API credentials
        run: |
          provider=$(uv run python -c "from finsent.config import load_settings; print(load_settings().ingestion.news_provider)")
          case "$provider" in
            gnews) test -n "$GNEWS_API_KEY" ;;
            *) test -n "$CURRENTS_API_KEY" ;;
          esac
        env:
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
      - run: uv run python -m finsent daily
        env:
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
      - name: Persist processed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/*.parquet data/processed/pipeline_state.json
          if git diff --cached --quiet; then
            echo "No processed data changes to commit."
          else
            git commit -m "chore(data): update daily pipeline data" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push
          fi
